[project]
name = "govplatform"
version = "0.1.0"
description = "Phase 0/1 prototype: governed knowledge object loop + MCP exposure"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.9",
  "uvicorn[standard]>=0.30",
  "mcp>=2.0",
  "rank-bm25>=0.2.2",
]

[dependency-groups]
dev = [
  "mypy>=1.11",
  "ruff>=0.6",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/govplatform"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = "rank_bm25.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
