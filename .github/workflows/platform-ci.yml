name: Platform CI

on:
  push:
    paths: ["platform/**", "scripts/**", ".mcp.json", ".github/workflows/platform-ci.yml"]
  pull_request:
    paths: ["platform/**", "scripts/**", ".mcp.json", ".github/workflows/platform-ci.yml"]

jobs:
  hard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - name: Verify platform
        working-directory: .
        run: bash scripts/verify.sh platform
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-verification
          path: .verification/
          include-hidden-files: true

  soft:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff format --check .

  advisory:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest --cov=govplatform --cov-report=term-missing
