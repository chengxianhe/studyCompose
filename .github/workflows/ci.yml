name: CI
on: [pull_request, push]

jobs:
  hard: # Require this check in the remote branch ruleset to block merges.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: bash scripts/verify.sh android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-verification
          path: .verification/
          include-hidden-files: true

  advisory: # advisory：只报告
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew jacocoTestReport
      - name: APK 体积
        run: ./gradlew assembleRelease && ls -lh app/build/outputs/apk/release/
